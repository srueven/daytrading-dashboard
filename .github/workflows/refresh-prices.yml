name: Refresh prices

# Scheduled price refresh removed. Quotes load in the browser when the
# dashboard is opened. workflow_dispatch still refreshes the committed
# fallback snapshot (data.json + embedded JSON) on request.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Yahoo quotes + FJ
        run: python3 refresh-prices.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
